<script>
let data = JSON.parse(localStorage.getItem('schoolData')||'{"classes":[],"students":[],"marks":{},"settings":{"resultsPublished":false}}');

function loadClasses(){
  const sel = document.getElementById('selClass');
  sel.innerHTML='<option value="">-- Select Class --</option>';
  if(data.classes) data.classes.forEach(c=>sel.innerHTML+=`<option value="${c.name}">${c.name}</option>`);
}
function loadSections(){
  const cName=document.getElementById('selClass').value;
  const sel=document.getElementById('selSection');
  sel.innerHTML='<option value="">-- Select Section --</option>';
  const cls=data.classes.find(c=>c.name===cName);
  if(cls) cls.sections.forEach(s=>sel.innerHTML+=`<option value="${s}">${s}</option>`);
}

function getGrade(p){
  if(p>=90)return{g:'A+',r:'Outstanding'};
  if(p>=80)return{g:'A',r:'Excellent'};
  if(p>=70)return{g:'B+',r:'Very Good'};
  if(p>=60)return{g:'B',r:'Good'};
  if(p>=50)return{g:'C',r:'Average'};
  if(p>=30)return{g:'D',r:'Pass'}; // Pass starts at 30% now
  return{g:'F',r:'Fail'};
}

function showResult(){
  if(!data.settings || data.settings.resultsPublished !== true) {
      const err=document.getElementById('errorMsg');
      err.innerHTML='⏳ <b>Results Not Published!</b><br>School has not published the results yet. Please check back later.';
      err.style.display='block'; return;
  }

  const cName=document.getElementById('selClass').value;
  const sec=document.getElementById('selSection').value;
  const roll=document.getElementById('rollNo').value.trim();
  const err=document.getElementById('errorMsg'); err.style.display='none';
  if(!cName||!sec||!roll){err.innerHTML='⚠️ Please fill all fields!';err.style.display='block';return;}
  
  const student = data.students.find(s=>s.class===cName && s.section===sec && s.roll.toString()===roll);
  if(!student){err.innerHTML='❌ No student found with this Roll Number!';err.style.display='block';return;}
  
  const key = `${cName}_${sec}_${roll}`;
  const studentMarks = data.marks[key];
  if(!studentMarks){err.innerHTML='❌ Marks have not been entered for this student yet!';err.style.display='block';return;}
  
  const cls = data.classes.find(c=>c.name===cName);
  let total=0, obtained=0;
  
  let rows = `<tr>
    <th>Subjects</th>
    <th>Full Marks<br><small style="font-weight:normal">(Th + Pr)</small></th>
    <th>Pass Marks<br><small style="font-weight:normal">(Th + Pr)</small></th>
    <th>Theory<br>Mark Obtained</th>
    <th>Prac / Assig<br>Mark Obtained</th>
    <th>Total<br>Mark Obtained</th>
    <th>Remarks</th>
  </tr>`;

  cls.subjects.forEach(sub=>{
    let m = studentMarks[sub.name];
    if(!m) return;
    
    // Convert to String to check for "AB"
    let thStr = String(m.th || '').trim().toUpperCase();
    let prStr = String(m.pr || '').trim().toUpperCase();
    let totStr = String(m.tot || '').trim().toUpperCase();
    
    // Treat AB as 0 for calculation
    let thVal = thStr === 'AB' ? 0 : parseFloat(thStr || 0);
    let prVal = prStr === 'AB' ? 0 : parseFloat(prStr || 0);
    let totVal = totStr === 'AB' ? 0 : parseFloat(totStr || 0);

    let isSubjectFail = false;
    
    // Yahan maine elective_single add kar diya hai
    if(sub.type === 'mil' || sub.type === 'nursery' || sub.type === 'elective_single') {
      let actualTotDisplay = totStr === 'AB' ? 'AB' : totVal;
      
      if(totVal < sub.passMarks || totStr === 'AB') isSubjectFail = true;
      
      rows += `<tr style="${isSubjectFail?'color:#dc3545':''}">
        <td>${sub.name}</td>
        <td>${sub.fullMarks}</td>
        <td>${sub.passMarks}</td>
        <td>-</td><td>-</td>
        <td><b>${actualTotDisplay}</b></td>
        <td style="font-weight:bold">${isSubjectFail?'Fail':'Pass'}</td>
      </tr>`;
      total += parseInt(sub.fullMarks); obtained += totVal;
    } 
    // Handling Normal Subjects & Normal Elective (Theory + Practical)
    else {
      let thDisplay = thStr === 'AB' ? 'AB' : thVal;
      let prDisplay = prStr === 'AB' ? 'AB' : prVal;
      let actualTotDisplay = (thStr === 'AB' && prStr === 'AB') ? 'AB' : (thVal + prVal);
      
      // Fail Condition for Normal: Absent, Theory < 24, Prac < 6, or Total < 30
      if(thStr === 'AB' || prStr === 'AB' || thVal < 24 || prVal < 6 || (thVal + prVal) < 30) isSubjectFail = true;

      rows += `<tr style="${isSubjectFail?'color:#dc3545':''}">
        <td>${sub.name}</td>
        <td>100 <small style="font-size:11px">(80+20)</small></td>
        <td>30 <small style="font-size:11px">(24+6)</small></td>
        <td>${thDisplay}</td>
        <td>${prDisplay}</td>
        <td><b>${actualTotDisplay}</b></td>
        <td style="font-weight:bold">${isSubjectFail?'Fail':'Pass'}</td>
      </tr>`;
      total += 100; obtained += (thVal + prVal);
    }
  });
  
  // FINAL RESULT LOGIC BASED ONLY ON 30% OF OVERALL TOTAL
  const percent = total > 0 ? ((obtained / total) * 100).toFixed(1) : 0;
  const grade = getGrade(percent);
  
  // If overall percentage is 30% or more, they PASS, else FAIL.
  const isOverallPass = parseFloat(percent) >= 30;
  const finalStatus = isOverallPass ? 'PASS' : 'FAIL';
  
  const coCurrGrade = studentMarks.coCurricular || '-';
  
  document.getElementById('marksheet').innerHTML=`
    <div class="ms-header">
      <img src="logo.png" alt="Logo">
      <h1>HOLY ROSE ENGLISH ACADEMY</h1>
      <p>REGISTERED UNDER ASSEB (ASSAM STATE SCHOOL EDUCATION BOARD)<br>U-Dise Code No:-18210802806, SILCHAR, ASSAM</p>
      <h3>HALF-YEARLY EXAMINATION REPORT (2026-27)</h3>
    </div>
    
    <div class="student-info">
      <div class="info-row"><strong>Student Name:</strong> ${student.name}</div>
      <div class="info-row"><strong>Roll Number:</strong> ${student.roll}</div>
      <div class="info-row"><strong>Class & Sec:</strong> ${student.class} - '${student.section}'</div>
      <div class="info-row"><strong>Father's Name:</strong> ${student.father||'-'}</div>
    </div>
    
    <table>${rows}</table>
    
    <div class="result-summary">
      <div class="summary-item bg-dark"><h4>Total Marks</h4><p>${obtained} / ${total}</p></div>
      <div class="summary-item bg-dark"><h4>Percentage</h4><p>${percent}%</p></div>
      <div class="summary-item bg-dark"><h4>Grade</h4><p>${grade.g}</p></div>
      <div class="summary-item bg-teal"><h4>Co-Curricular</h4><p>${coCurrGrade}</p></div>
      <div class="summary-item ${isOverallPass?'bg-pass':'bg-fail'}"><h4>Final Result</h4><p>${finalStatus}</p></div>
    </div>
    
    <div class="signature-area">
      <div class="sig-box">Class Teacher</div>
      <div class="sig-box">Official Seal</div>
      <div class="sig-box">Principal</div>
    </div>
    
    <div class="nb-note">
      <strong>N.B:-</strong> Without Official seal and Principal signature, this marksheet will be considered invalid.
    </div>`;
  
  document.getElementById('searchSection').style.display='none';
  document.getElementById('marksheetSection').style.display='block';
  window.scrollTo(0,0);
}

function goBack(){
  document.getElementById('searchSection').style.display='block';
  document.getElementById('marksheetSection').style.display='none';
}

window.addEventListener('focus', () => {
    data = JSON.parse(localStorage.getItem('schoolData')||'{"classes":[],"students":[],"marks":{},"settings":{"resultsPublished":false}}');
});
loadClasses();
</script>
</body>
